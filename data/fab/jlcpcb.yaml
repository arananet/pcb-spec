# JLCPCB Standard PCB capability matrix
#
# Primary sources (access manually in a browser — both block automated fetching):
#   Capabilities page: https://jlcpcb.com/capabilities/pcb-capabilities
#   Design rules blog: https://jlcpcb.com/blog/pcb-design-rules-best-practices
#
# IMPORTANT: JLCPCB's pages block automated fetching. Values below are marked
# verified: false until a human has confirmed each value against the primary
# sources above. Do NOT use unverified values in production sign-off gates —
# the conformance checker must skip FAB_DFM gates when verified: false.
#
# To verify: open both URLs in a browser, cross-check each field below,
# set verified: true, fill in the value, and update last_verified to today's date.

schema_version: "0.1"
