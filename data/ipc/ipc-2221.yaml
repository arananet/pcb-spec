    min_voltage_v: 0
    max_voltage_v: 15
    clearance_external_uncoated_mm: 0.1
    clearance_external_coated_mm: 0.1
    clearance_internal_mm: 0.05
    citation: "IPC-2221B:2003 Table 6-1 row B1"

