# IPC-2221 voltage clearance table
#
# Source: IPC-2221B:2003 "Generic Standard on Printed Board Design",
# Table 6-1 "Electrical Clearance for Printed Boards".
#
# These values define the minimum conductor spacing as a function of
# peak working voltage and conductor environment (external uncoated,
# external coated, or internal).
#
# IMPORTANT: These values are derived from widely-reproduced references
# to IPC-2221B Table 6-1. Verify against the purchased standard document
# (available from IPC at https://www.ipc.org/TOC/IPC-2221B.pdf) before
# using in production sign-off gates.
#
# Voltage classes B1–B9 are defined in IPC-2221B §6.3.1.
# "Coated" means conformal coating applied per IPC-A-610.
# "External" means outer copper layers; "Internal" means inner layers
# fully encapsulated in dielectric.

schema_version: "0.1"
standard: "IPC-2221B:2003"
table: "Table 6-1 — Electrical Clearance"
citation: "IPC-2221B:2003 Table 6-1 (IPC, https://www.ipc.org)"

voltage_clearance_table:
