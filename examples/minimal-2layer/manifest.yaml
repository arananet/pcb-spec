manifest_version: "0.1"

project:
  name: "minimal-2layer"
  revision: "r1"

stackup:
  fab_house_id: "jlcpcb"
  # Opaque ID referencing JLCPCB's standard 2-layer stackup.
  # Dielectric and prepreg values are in JLCPCB's capability sheet, not inline.
  stackup_id: "jlcpcb-standard-2l"
  layers:
    - number: 1
      name: "F.Cu"
      type: signal
      copper_oz: 1
    - number: 2
      name: "B.Cu"
      type: signal
      copper_oz: 1

rules:
  current_capacity:
    citation: "IPC-2152, Table 5-1"
    entries: []  # populated by standards-rule-library spec

  spacing:
    citation: "IPC-2221B, Table 6-1"
    entries: []  # populated by standards-rule-library spec

  fab_dfm:
    citation: "JLCPCB Standard PCB Capability — https://jlcpcb.com/capabilities/pcb-capabilities"
    entries: []  # populated by standards-rule-library spec

  impedance:
    citation: "IPC-2141A"
    profiles: []  # no controlled-impedance nets in this design

net_classes:
  DEFAULT:
    description: "All signals with no special routing requirements."
    members: []  # populated per design; empty in this minimal example
    rules:
      # 6 mil is JLCPCB's published minimum trace width for standard PCBs.
      # Source: JLCPCB Standard PCB Capability sheet.
      # This is a fab DFM floor, not a current-capacity-derived minimum.
      min_width_mil: 6
      route_layers: ["F.Cu", "B.Cu"]

placement: []

gates:
  schematic: []
  layout: []
  dfm: []
